<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 996 62" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Renderer engineer · Graphics programmer · GPU programmer · Engine programmer">
  <defs>
    <linearGradient id="under" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#8658E3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8658E3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8658E3" stop-opacity="0"/>
