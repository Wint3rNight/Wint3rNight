  <rect x="18" y="56" width="960" height="1.2" fill="url(#under)"/>

  <g font-family="JetBrains Mono, Fira Code, ui-monospace, monospace" font-size="20">
    <text x="30" y="42" fill="#8658E3" font-weight="700">&gt;</text>
