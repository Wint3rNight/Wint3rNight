name: Rebuild Cards

on:
  schedule:
    - cron: "23 5 * * *"   # daily, 05:23 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate upstream OSS card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/gen_oss.py

      # Runs after gen_oss.py: the stats card imports its upstream summary.
      - name: Regenerate featured + stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/gen_cards.py

      - name: Regenerate activity flow chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/gen_activity.py

      # The stack diagram marks which stages have upstream contributions,
      # so it needs regenerating when those counts change.
      - name: Regenerate stack diagram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/gen_pipeline.py

      # Deterministic, so this normally produces no diff. It's here to keep
      # the script authoritative: header.svg and pipeline.svg have both been
      # hand-edited into a state their generator couldn't reproduce, which
      # meant the next run would silently revert the better version.
      - name: Regenerate header
        run: python3 scripts/gen_header.py

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "build: refresh cards + activity"
          branch: main
          file_pattern: assets/featured-*.svg assets/stats.svg assets/activity.svg assets/oss.svg assets/pipeline.svg assets/header.svg
